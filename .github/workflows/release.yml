name: Build and Release RPM

on:
  push:
    tags:
      - 'v*'
      - '[0-9]*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión para empaquetar (ej. 1.0.0)'
        required: true
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-rpm:
    name: Compilar RPM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Determinar versión
        id: version_step
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VER="${{ github.event.inputs.version }}"
          elif [ "${{ github.event_name }}" = "release" ]; then
            VER="${{ github.event.release.tag_name }}"
          else
            VER="${GITHUB_REF#refs/tags/}"
          fi
          # Eliminar prefijo 'v' si existe para el paquete RPM
          RPM_VER="${VER#v}"
          echo "VERSION=${RPM_VER}" >> $GITHUB_ENV
          echo "TAG_NAME=${VER}" >> $GITHUB_ENV
          echo "Compilando RPM versión: ${RPM_VER} para tag: ${VER}"

      - name: Instalar herramientas de RPM
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Construir paquete RPM
        run: |
          chmod +x packaging/build_rpm.sh
          ./packaging/build_rpm.sh "${{ env.VERSION }}"

      - name: Guardar paquete como artefacto de GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: cloudsync-rpm-v${{ env.VERSION }}
          path: dist/*.rpm
          retention-days: 14

      - name: Publicar o adjuntar en GitHub Releases
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.rpm
          tag_name: ${{ env.TAG_NAME }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
