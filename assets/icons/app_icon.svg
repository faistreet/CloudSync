<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.4" flood-color="#0284c7"/>
    </filter>
  </defs>
  <!-- Background rounded card -->
  <rect width="128" height="128" rx="30" fill="url(#bgGrad)"/>
  <rect x="2" y="2" width="124" height="124" rx="28" fill="none" stroke="#334155" stroke-width="1.5" opacity="0.6"/>

  <!-- Cloud shape with vibrant blue gradient -->
  <path d="M42 82h46c9.94 0 18-8.06 18-18 0-8.84-6.38-16.19-14.88-17.65C89.4 34.6 79.5 26 67.5 26c-11.2 0-20.67 7.55-23.54 17.84C34.42 45.47 27 53.86 27 64c0 9.94 8.06 18 18 18z" 
        fill="url(#cloudGrad)" filter="url(#shadow)"/>

  <!-- Glowing sync circle with emerald/cyan accent -->
  <circle cx="64" cy="61" r="17" fill="#0f172a" opacity="0.85"/>
  <circle cx="64" cy="61" r="15" fill="none" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="24 10"/>
  <polygon points="76,55 77,48 70,51" fill="#38bdf8"/>
  <polygon points="52,67 51,74 58,71" fill="#10b981"/>
